<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DMX Master Companion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>DMX Master</h1>
        <div id="status" class="status-dot disconnected"></div>
    </header>

    <div class="tabs">
        <button id="tab-scenes" class="tab-btn active">Scenes</button>
        <button id="tab-vc" class="tab-btn">Virtual Console</button>
    </div>

    <main>
        <section class="controls-section">
            <button id="btn-blackout" class="btn-danger">SOFT BLACKOUT</button>
        </section>

        <section id="section-scenes" class="tab-content active">
            <div id="scenes-container" class="grid-container">
                <!-- Scenes will be populated here by app.js -->
            </div>
        </section>

        <section id="section-vc" class="tab-content">
            <div id="vc-pages-nav" class="vc-pages-nav">
                <!-- Page buttons populated by app.js -->
            </div>
            <div class="vc-container-wrapper">
                <div id="vc-container" class="vc-container">
                    <!-- Virtual console widgets populated by app.js -->
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
